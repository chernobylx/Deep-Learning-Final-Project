[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlb-prediction"
version = "1.0.0"
description = "Multi-output neural network for predicting MLB game scores"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Jonathan Chernoch" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "tensorflow>=2.15",
    "keras-tuner>=1.4",
    "matplotlib>=3.7",
    "seaborn>=0.13",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
